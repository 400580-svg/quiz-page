<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fa500f">
    <title>Zaiden</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Quiz home">
          <span class="brand-mark" aria-hidden="true">V</span>
          <span>Zaiden</span>
        </a>
        <span class="version-pill">Built with Vibe ✨</span>
      </header>

      <section class="quiz-card" aria-labelledby="quiz-title">
        <p class="eyebrow"><span class="status-dot"></span> Vibe Code Quiz</p>
        <h1 id="quiz-title">Zaiden</h1>

        <div id="start-screen">
          <p class="intro">Six quick questions about Vibe, the coding agent by Mistral AI. How many can you get right?</p>
          <button id="start-btn" class="btn-primary" type="button">Start the quiz →</button>
        </div>

        <div id="quiz-screen" hidden>
          <div class="meta-row">
            <span id="progress" class="progress">Question 1 of 6</span>
            <span id="score" class="score">Score: 0</span>
          </div>
          <h2 id="question-text" class="question">Loading…</h2>
          <div id="answers" class="answers"></div>
          <p id="feedback" class="feedback" aria-live="polite"></p>
          <button id="next-btn" class="btn-primary" type="button" hidden>Next question →</button>
        </div>

        <div id="result-screen" hidden>
          <h2 id="result-title" class="question">Quiz complete!</h2>
          <p id="result-text" class="intro"></p>
          <button id="restart-btn" class="btn-primary" type="button">Play again ↺</button>
        </div>
      </section>

      <footer>
        <span>Static 
frontend</span>
        <span>Express API</span>
        <span>Made with Vibe</span>
      </footer>
    </main>
  </body>
</html>
