<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — NFL Quiz Central</title>
  <style>
    :root { --turf:#1B4D3E; --gold:#F5B041; --cream:#FAF9F6; --ink:#181A1B; --slate:#7C7571; --red:#E74C3C; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui, sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; display:grid; place-items:center; padding:1rem; }
    .card { background:#fff; width:min(420px, 94vw); padding:2.5rem 2.25rem; border-radius:14px; border:2px solid #ECE9E4; border-top:6px solid var(--gold); box-shadow:0 12px 40px rgba(24,26,27,.10); text-align:center; }
    .logo { font-size:2.4rem; }
    h1 { color:var(--turf); letter-spacing:.08em; margin:.4rem 0 .2rem; font-size:1.45rem; }
    .tagline { color:var(--gold); letter-spacing:.35em; font-size:.8rem; font-weight:600; margin:0 0 1.5rem; }
    label { display:block; text-align:left; color:var(--slate); font-size:.72rem; font-weight:600; letter-spacing:.14em; margin:1rem 0 0; }
    input { display:block; width:100%; margin-top:.35rem; padding:.85rem 1rem; border:2px solid #E5E1DA; border-radius:8px; background:var(--cream); font-size:1rem; min-height:48px; }
    input:focus { border-color:var(--gold); background:#fff; outline:none; }
    button { width:100%; margin-top:1.5rem; padding:.95rem; background:var(--turf); color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:700; letter-spacing:.18em; cursor:pointer; min-height:48px; }
    button:hover { background:#15503E; }
    .msg { color:var(--red); min-height:1.2em; margin:.75rem 0 0; font-size:.9rem; }
    .footer { margin-top:1.5rem; font-size:.92rem; color:var(--slate); }
    a { color:var(--turf); font-weight:600; text-decoration:none; border-bottom:2px solid var(--gold); }
  </style>
</head>
<body>
  <main class="card">
    <span class="logo">&#127944;</span>
    <h1>NFL QUIZ CENTRAL</h1>
    <p class="tagline">TAKE THE FIELD</p>

    <form id="login-form">
      <label>USERNAME OR EMAIL
        <input name="username" placeholder="Your username or email" autocomplete="username" required />
      </label>
      <label>PASSWORD
        <input name="password" type="password" placeholder="Your password" autocomplete="current-password" required />
      </label>
      <button type="submit">LOG IN</button>
      <p id="msg" class="msg"></p>
    </form>

    <div class="footer">
      <p>No account yet? <a href="/register.html">JOIN THE LEAGUE</a></p>
      <p><a href="/" style="border-bottom:none; font-size:.75rem; color:var(--slate);">Back to home</a></p>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('msg');
      msgEl.textContent = 'Signing in...';
      const data = Object.fromEntries(new FormData(e.target));
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const out = await res.json();
        if (res.ok) {
          msgEl.textContent = 'Welcome back!';
          setTimeout(() => location.href = '/dashboard.html', 700);
        } else {
          msgEl.textContent = out.error || 'Login failed.';
        }
      } catch (err) {
        msgEl.textContent = 'Could not reach the server. Is it running?';
      }
    });
  </script>
</body>
</html>
