<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — NFL Quiz Central</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="card">
    <h1>Register</h1>
    <form id="register-form">
      <label>Username<input name="username" required /></label>
      <label>Email<input name="email" type="email" required /></label>
      <label>Password (8+ characters)<input name="password" type="password" minlength="8" required /></label>
      <label>Educator key (optional)<input name="teacherKey" placeholder="Leave blank for student account" /></label>
      <button class="btn" type="submit">Create Account</button>
      <p id="msg" class="msg"></p>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
